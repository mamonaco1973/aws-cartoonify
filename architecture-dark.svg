<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="790" viewBox="0 0 1620 790" role="img" aria-label="A browser loads the single-page app from the public cartoonify-web S3 bucket and signs in through the Cognito Hosted UI with the authorization code flow. It calls cartoonify-api, an HTTP API whose JWT authorizer checks the Cognito token, and the five Python API functions behind it. upload-url returns a presigned POST so the browser uploads the photo straight to the private media bucket; submit checks the daily quota, writes a job row to DynamoDB and puts the job on the cartoonify-jobs SQS queue. The queue triggers the container-image worker one job at a time; it reads the original, calls a Stability model on Amazon Bedrock through a US inference profile, writes the cartoon back to the media bucket and updates the job's status."><defs><marker id="a_e_page" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker><marker id="a_e_auth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker><marker id="a_e_api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_fns" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker><marker id="a_e_row" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker><marker id="a_e_enq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2c163"/></marker><marker id="a_e_trig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f2c163"/></marker><marker id="a_e_media" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker><marker id="a_e_img" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8d6e8"/></marker><marker id="a_e_bed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c39be8"/></marker><marker id="a_e_stat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7ee787"/></marker></defs><rect width="1620" height="790" fill="#0d1117"/><path d="M600,95.0 H465" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#a_e_page)"/><text x="530.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7ee787" stroke="#0d1117" stroke-width="6" paint-order="stroke">GET page</text><path d="M1020,95.0 H1155" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_auth)"/><text x="1090.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c39be8" stroke="#0d1117" stroke-width="6" paint-order="stroke">sign in, JWT</text><path d="M730.0,150 V195.0 H250.0 V235" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#a_e_up)"/><text x="264.0" y="185.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7ee787" stroke="#0d1117" stroke-width="6" paint-order="stroke">presigned POST</text><path d="M810.0,150 V235" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_api)"/><text x="824.0" y="215.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" stroke="#0d1117" stroke-width="6" paint-order="stroke">Bearer JWT</text><path d="M1020,295.0 H1155" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#a_e_fns)"/><text x="1090.0" y="283.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#58a6ff" stroke="#0d1117" stroke-width="6" paint-order="stroke">5 routes</text><path d="M1370.0,350 V435" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#a_e_row)"/><text x="1384.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7ee787" stroke="#0d1117" stroke-width="6" paint-order="stroke">job rows</text><path d="M1250.0,350 V395.0 H810.0 V435" fill="none" stroke="#f2c163" stroke-width="2" marker-end="url(#a_e_enq)"/><text x="824.0" y="385.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f2c163" stroke="#0d1117" stroke-width="6" paint-order="stroke">submit</text><path d="M600,495.0 H465" fill="none" stroke="#f2c163" stroke-width="2" marker-end="url(#a_e_trig)"/><text x="530.0" y="483.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f2c163" stroke="#0d1117" stroke-width="6" paint-order="stroke">trigger</text><path d="M250.0,440 V355" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#a_e_media)"/><text x="264.0" y="401.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7ee787" stroke="#0d1117" stroke-width="6" paint-order="stroke">original, cartoon</text><path d="M250.0,640 V555" fill="none" stroke="#c8d6e8" stroke-width="2" marker-end="url(#a_e_img)"/><text x="264.0" y="615.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c8d6e8" stroke="#0d1117" stroke-width="6" paint-order="stroke">image</text><path d="M330.0,550 V610.0 H810.0 V635" fill="none" stroke="#c39be8" stroke-width="2" marker-end="url(#a_e_bed)"/><text x="824.0" y="630.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#c39be8" stroke="#0d1117" stroke-width="6" paint-order="stroke">InvokeModel</text><path d="M410.0,550 V580.0 H1370.0 V555" fill="none" stroke="#7ee787" stroke-width="2" marker-end="url(#a_e_stat)"/><text x="1384.0" y="601.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#7ee787" stroke="#0d1117" stroke-width="6" paint-order="stroke">status</text><rect x="600" y="40" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#c8d6e8" stroke-width="2"/><g transform="translate(620,80.0) scale(1.25)" fill="none" stroke="#c8d6e8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></g><text x="664.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">Browser</text><text x="664.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">index.html + callback.html</text><rect x="40" y="40" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/><g transform="translate(60,80.0) scale(1.25)" fill="none" stroke="#7ee787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></g><text x="104.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">cartoonify-web-&lt;hex&gt;</text><text x="104.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">public S3 bucket: SPA</text><rect x="1160" y="40" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#c39be8" stroke-width="2"/><g transform="translate(1180,80.0) scale(1.25)" fill="none" stroke="#c39be8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g><text x="1224.0" y="91.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6edf3">Cognito user pool</text><text x="1224.0" y="117.0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">Hosted UI, code flow, email sign-in</text><rect x="40" y="240" width="420" height="110" rx="10" ry="10" fill="#161b22" stroke="#7ee787" stroke-width="2"/><g transform="translate(60,280.0) scale(1.25)" fill="none" stroke="#7ee787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91